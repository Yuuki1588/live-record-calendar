<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ライブ予定追加</title>
</head>

<body>

    <!-- ライブ予定追加画面のタイトル -->
    <h1>ライブ予定追加</h1>

    <!-- ライブ予定を登録するフォーム -->
    <form method="post">

        <!-- 不正なフォーム送信を防ぐため -->
        {% csrf_token %}

        <!-- forms.pyで作ったLiveScheduleFormを表示 -->
        {{ form.as_p }}

        <!-- 入力したライブ予定を登録 -->
        <button type="submit">登録</button>

    </form>

    <!-- 登録せずにカレンダーへ戻る -->
    <p>
        <a href="{% url 'home' %}">カレンダーへ戻る</a>
    </p>

</body>

</html>
