<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>履歴</title>
</head>

<body>

    <h1>ライブ履歴</h1>

    <!-- 履歴の並べ替え -->
    <form method="get">

    <label for="sort">並べ替え：</label>

    <select name="sort" id="sort">
        <option value="new" {% if sort == "new" %}selected{% endif %}>
            新しい順
        </option>

        <option value="old" {% if sort == "old" %}selected{% endif %}>
            古い順
        </option>

        <option value="artist" {% if sort == "artist" %}selected{% endif %}>
            アーティスト順
        </option>

        <option value="venue" {% if sort == "venue" %}selected{% endif %}>
            会場名順
        </option>
    </select>

    <button type="submit">並べ替える</button>

    
        <!-- 履歴の絞り込み -->
    

        <label for="year">年：</label>

        <select name="year" id="year">
        <option value="">すべて</option>

       {% for y in years %}
            <option value="{{ y }}" {% if year == y|stringformat:"s" %}selected{% endif %}>
                {{ y }}年
            </option>
        {% endfor %}
        </select>

        

        <label for="month">月：</label>


        <select name="month" id="month">
            <option value="" {% if not month %}selected{% endif %}>すべて</option>
            <option value="1" {% if month == "1" %}selected{% endif %}>1月</option>
            <option value="2" {% if month == "2" %}selected{% endif %}>2月</option>
            <option value="3" {% if month == "3" %}selected{% endif %}>3月</option>
            <option value="4" {% if month == "4" %}selected{% endif %}>4月</option>
            <option value="5" {% if month == "5" %}selected{% endif %}>5月</option>
            <option value="6" {% if month == "6" %}selected{% endif %}>6月</option>
            <option value="7" {% if month == "7" %}selected{% endif %}>7月</option>
            <option value="8" {% if month == "8" %}selected{% endif %}>8月</option>
            <option value="9" {% if month == "9" %}selected{% endif %}>9月</option>
            <option value="10" {% if month == "10" %}selected{% endif %}>10月</option>
            <option value="11" {% if month == "11" %}selected{% endif %}>11月</option>
            <option value="12" {% if month == "12" %}selected{% endif %}>12月</option>
        </select>

        
        <label for="artist">アーティスト：</label>

        <select name="artist" id="artist">
            <option value="">すべて</option>

            {% for a in artists %}
                <option value="{{ a.id }}" {% if artist == a.id|stringformat:"s" %}selected{% endif %}>
                    {{ a.artist_name }}
                </option>
            {% endfor %}
        </select>

        
        <label for="venue">会場：</label>

        <select name="venue" id="venue">
            <option value="">すべて</option>

            {% for v in venues %}
                <option value="{{ v.id }}" {% if venue == v.id|stringformat:"s" %}selected{% endif %}>
                    {{ v.venue_name }}
                </option>
            {% endfor %}
        </select>

        
        <label for="emotion">感情：</label>

        <select name="emotion" id="emotion">
            <option value="" {% if not emotion %}selected{% endif %}>すべて</option>
            <option value="最高" {% if emotion == "最高" %}selected{% endif %}>最高</option>
            <option value="楽しかった" {% if emotion == "楽しかった" %}selected{% endif %}>楽しかった</option>
            <option value="感動" {% if emotion == "感動" %}selected{% endif %}>感動</option>
            <option value="普通" {% if emotion == "普通" %}selected{% endif %}>普通</option>
            <option value="残念" {% if emotion == "残念" %}selected{% endif %}>残念</option>
        </select>

        
        <label for="favorite">お気に入り：</label>

        <select name="favorite" id="favorite">
            <option value="" {% if not favorite %}selected{% endif %}>
                すべて
            </option>

            <option value="true" {% if favorite == "true" %}selected{% endif %}>
                お気に入りのみ
            </option>
        </select>

        <button type="submit">絞り込む</button>
        <a href="{% url 'history' %}">リセット</a>

    </form>
    {% for record in records %}

    <div>
        <a href="{% url 'live_detail' record.live_schedule.id %}">
            <p>
                日付：{{ record.live_schedule.event_date }}
            </p>

            <p>
                アーティスト：{{ record.live_schedule.artist }}
            </p>

            <p>
                会場：{{ record.live_schedule.venue }}
            </p>
        </a>

        <hr>
    </div>

{% empty %}

    <p>ライブ記録はまだありません。</p>

{% endfor %}

</body>

</html>
