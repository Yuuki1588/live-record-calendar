<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログアウト確認</title>
</head>

<body>
    <!-- ログアウト確認画面全体 -->
    <div class="logout-container">

        <h1>ログアウト</h1>

        <p>ログアウトしますか？</p>

        <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <!-- ログアウトを実行するボタン -->
        <button type="submit" class="logout-button">はい</button>

        <a href="{% url 'mypage' %}">
        <!-- ログアウトせずマイページに戻るボタン -->
        <button type="button" class="cancel-button">いいえ</button>
        </a>

        </form>
    </div>

</body>

</html>
