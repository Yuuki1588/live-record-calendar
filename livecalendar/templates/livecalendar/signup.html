<!-- このページがHTML5で作られていることを宣言する -->
<!DOCTYPE html>

<!-- このページが日本語のページであることを表す -->
<html lang="ja">

<head>
    <!-- 日本語などの文字化けを防ぐ -->
    <meta charset="UTF-8">

    <!-- ブラウザのタブに表示するタイトル -->
    <title>新規登録</title>
</head>

<body>
     <!-- 新規登録画面全体 -->
    <div class="signup-container">

        <!-- 新規登録画面のタイトルを表示する -->
        <h1>新規登録</h1>

        <!-- 入力された情報をPOST方式でDjangoに送信する -->
        <form method="post">

            <!-- 不正なフォーム送信を防ぐためのセキュリティ機能 -->
            {% csrf_token %}

            <!-- forms.pyで作成した新規登録フォームを表示する -->
            {{ form.as_p }}

            <!-- 入力した内容を送信する登録ボタン -->
            <button type="submit" class="signup-button">登録</button>

        </form>

        <a href="/login/" class="back-link">ログイン画面へ戻る</a>
   </div>
</body>
</html>
