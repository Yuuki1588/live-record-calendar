<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定</title>
</head>
<body>

    <!-- パスワード再設定画面全体 -->
    <div class="password-reset-container">

        <!-- 画面タイトル -->
        <h1>パスワード再設定</h1>

        <!-- 入力についての説明 -->
        <p>
            登録済みのメールアドレスを入力してください。
        </p>

        <!-- メールアドレス入力フォーム -->
        <form method="post">
            {% csrf_token %}

            <!-- 入力欄とエラーメッセージ -->
            {{ form.as_p }}

            <!-- 送信ボタン -->
            <button type="submit" class="reset-button">
                再設定メールを送信
            </button>
        </form>

        <!-- ログイン画面へ戻る -->
        <p class="login-link">
            <a href="{% url 'login' %}">ログイン画面に戻る</a>
        </p>

    </div>

</body>
</html>
