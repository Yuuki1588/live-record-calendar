<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
</head>

<body>

    <h1>パスワード変更</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

<form method="post">

    <!-- パスワードを変更するフォーム -->
    <form method="post">
        {% csrf_token %}

        <p>
            <label for="current_password">現在のパスワード</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                required
            >
        </p>

        <p>
            <label for="new_password">新しいパスワード</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                required
            >
        </p>

        <p>
            <label for="confirm_password">新しいパスワード（確認）</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >
        </p>

        <button type="submit">変更</button>

    </form>

</body>

</html>
