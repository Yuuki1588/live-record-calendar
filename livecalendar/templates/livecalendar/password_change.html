<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
</head>

<body>

    <!-- パスワード変更画面全体 -->
    <div class="password-change-container">


        <h1>パスワード変更</h1>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}


        <!-- パスワードを変更するフォーム -->
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="current_password">現在のパスワード</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new_password">新しいパスワード</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">新しいパスワード（確認）</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >
            </div>

            <!-- パスワードの変更内容を保存する -->
            <button type="submit" class="save-button">更新</button>

        </form>
    </div>
</body>

</html>
