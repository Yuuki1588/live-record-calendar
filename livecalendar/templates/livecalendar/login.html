<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
    <!-- ログイン画面全体 -->
    <div class="login-container">
        <h1>ライブ記録カレンダー</h1>

        <form method="post">
        {% csrf_token %}

        <!-- ログインフォームの入力欄全体 -->
        <div class="login-form-fields">
           <!-- ユーザー名の入力欄 -->
            <p>
                <label for="{{ form.username.id_for_label }}">ユーザー名</label>
                {{ form.username }}
            </p>

            <!-- パスワードの入力欄 -->
            <p>
                <label for="{{ form.password.id_for_label }}">パスワード</label>
                {{ form.password }}
            </p>
        </div>

        <button type="submit" class="login-button">ログイン</button>
        </form>

        <!-- アカウントを持っていない場合、新規登録画面へ移動する -->
        <p class="signup-link">
        アカウントをお持ちでない方は
        <a href="{% url 'signup' %}">新規登録はこちら</a>
        </p>
    </div>
</body>
</html>
