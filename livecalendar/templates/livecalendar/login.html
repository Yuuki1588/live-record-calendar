<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
    <!-- ログイン画面全体 -->
    <div class="login-container">
        <h1>ライブ記録カレンダー</h1>

        <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="login-button">ログイン</button>
        </form>

        <!-- アカウントを持っていない場合、新規登録画面へ移動する -->
        <p class="signup-link">
        アカウントをお持ちでない方は
        <a href="/signup/">新規登録はこちら</a>
        </p>
    </div>
</body>
</html>
