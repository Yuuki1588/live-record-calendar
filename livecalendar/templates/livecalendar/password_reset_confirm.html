<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新しいパスワードの設定</title>
</head>
<body>

    <!-- パスワード再設定画面全体 -->
    <div class="password-reset-confirm-container">

        <!-- 画面タイトル -->
        <h1>新しいパスワードの設定</h1>

        <!-- 再設定リンクが有効な場合 -->
        {% if validlink %}

            <!-- 入力についての説明 -->
            <p>
                新しいパスワードを入力してください。
            </p>

            <!-- パスワード変更フォーム -->
            <form method="post">
                {% csrf_token %}

                <!-- 新しいパスワードと確認用の入力欄 -->
                {{ form.as_p }}

                <!-- パスワード変更ボタン -->
                <button type="submit" class="reset-confirm-button">
                    パスワードを変更する
                </button>
            </form>

        <!-- 再設定リンクが無効な場合 -->
        {% else %}

            <!-- リンクが無効であることを表示 -->
            <p>
                このパスワード再設定リンクは無効か、
                すでに使用されています。
            </p>

            <!-- 再設定をやり直すリンク -->
            <p>
                <a href="{% url 'password_reset' %}">
                    パスワード再設定をやり直す
                </a>
            </p>

        {% endif %}

    </div>

</body>
</html>
