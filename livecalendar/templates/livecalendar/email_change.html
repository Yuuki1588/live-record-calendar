<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>メールアドレス変更</title>
</head>

<body>

    <h1>メールアドレス変更</h1>

    <!-- メールアドレスを変更するフォーム -->
    <form method="post">
        {% csrf_token %}

        <label for="email">メールアドレス</label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ user.email }}"
            required
        >

        <button type="submit">保存</button>

    </form>

</body>

</html>
