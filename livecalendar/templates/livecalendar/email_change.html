<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>メールアドレス変更</title>
</head>

<body>
    <!-- メールアドレス変更画面全体 -->
    <div class="email-change-container">
        <h1>メールアドレス変更</h1>

        <!-- メールアドレスを変更するフォーム -->
        <form method="post">
            {% csrf_token %}
        <!-- メールアドレス入力欄 -->
        <div class="form-group">
            <label for="email">メールアドレス</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ user.email }}"
                required
            >
        </div>
        
            <button type="submit" class="save-button">保存</button>

        </form>
    </div>
</body>

</html>
