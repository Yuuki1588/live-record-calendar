<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定メール送信完了</title>
</head>
<body>

    <!-- メール送信完了画面全体 -->
    <div class="password-reset-done-container">

        <!-- 画面タイトル -->
        <h1>🔒 パスワード再設定メールを送信しました</h1>

        <!-- メール送信後の案内 -->
        <p>
            ご登録のメールアドレス宛に<br>
            パスワード再設定用のリンクを<br>
            送信しました。<br>
            メールを確認し、リンクをク<br>
            リックして新しいパスワード<br>
            を設定してください。
        </p>

        <!-- 補足説明 -->
        <p>
            メールが届かない場合は、メールアドレスをご確認ください。
        </p>

        <!-- ログイン画面に戻るリンク -->
        <p class="login-link">
            <a href="{% url 'login' %}">ログイン画面に戻る</a>
        </p>

    </div>

</body>
</html>
