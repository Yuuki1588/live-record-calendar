<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>プロフィール編集</title>
</head>

<body>
    <!-- プロフィール編集画面全体 -->
    <div class="profile-edit-container">
        <h1>プロフィール編集</h1>

        
       <!-- プロフィール編集フォーム -->
        <form method="post" class="profile-edit-form">
            {% csrf_token %}

            <!-- ユーザー名入力欄 -->
        <div class="form-group">

            <label for="username">ユーザー名</label>

            <input
                type="text"
                id="username"
                name="username"
                value="{{ user.username }}"
                required
            >
        </div>
        <button type="submit" class="save-button">保存</button>
        </form>
    </div>
</body>

</html>
