
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定完了</title>
</head>
<body>

    <!-- パスワード再設定完了画面全体 -->
    <div class="password-reset-complete-container">

        <!-- 画面タイトル -->
        <h1>パスワードの再設定が完了しました</h1>

        <!-- 完了メッセージ -->
        <p>
            パスワードが正常に変更されました。
        </p>

        <!-- ログイン案内 -->
        <p>
            新しいパスワードでログインしてください。
        </p>

        <!-- ログイン画面へのリンク -->
        <p class="login-link">
            <a href="{% url 'login' %}">
                ログイン画面へ戻る
            </a>
        </p>

    </div>

</body>
</html>
