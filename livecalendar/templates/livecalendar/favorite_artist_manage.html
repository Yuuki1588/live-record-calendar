<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>お気に入りアーティスト管理</title>
</head>

<body>

    <!-- お気に入りアーティスト管理画面全体 -->
    <div class="favorite-manage-container">

        <h1>お気に入りアーティスト管理</h1>

        {% for favorite in favorite_artists %}

            <!-- お気に入りアーティスト1件 -->
        <div class="favorite-item">

            <span>{{ favorite.artist }}</span>
            <!-- お気に入りアーティストを削除する -->
            <form
                method="post"
                action="{% url 'favorite_artist_delete' favorite.id %}"
            >
                {% csrf_token %}

                <button type="submit" class="delete-button">削除</button>
            </form>
        </div>

        {% empty %}

            <p class="empty-message">お気に入りアーティストはまだ登録されていません。</p>

        {% endfor %}

        <a href="{% url 'favorite_artist_add' %}" class="add-button">
            ＋ アーティストを追加
        </a>
    </div>
</body>

</html>
